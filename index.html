<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SquareSpace — T-Shirt Quilt Designer</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>SquareSpace</h1>
    <p class="subtitle">NY Upstate Quilt-Square T-Shirt Designer</p>
  </header>

  <main>
    <aside id="controls">
      <section class="control-group">
        <h2>Pattern</h2>
        <div id="pattern-selector" class="pattern-grid"></div>
      </section>

      <section class="control-group">
        <h2>Color Palette</h2>
        <div id="preset-palettes" class="preset-row"></div>
        <div class="color-pickers">
          <label>
            <span class="color-label">Primary</span>
            <input type="color" id="color-primary" value="#c0392b">
            <span class="swatch" id="swatch-primary"></span>
          </label>
          <label>
            <span class="color-label">Secondary</span>
            <input type="color" id="color-secondary" value="#2c3e50">
            <span class="swatch" id="swatch-secondary"></span>
          </label>
          <label>
            <span class="color-label">Accent</span>
            <input type="color" id="color-accent" value="#f39c12">
            <span class="swatch" id="swatch-accent"></span>
          </label>
          <label>
            <span class="color-label">Background</span>
            <input type="color" id="color-background" value="#ecf0f1">
            <span class="swatch" id="swatch-background"></span>
          </label>
        </div>
      </section>

      <section class="control-group">
        <h2>Layout</h2>
        <div class="control-row">
          <label for="scale-slider">Tile Scale</label>
          <input type="range" id="scale-slider" min="0.5" max="3" step="0.1" value="1">
          <span id="scale-value">1.0x</span>
        </div>
        <div class="control-row">
          <label>Rotation</label>
          <div class="rotation-btns">
            <button class="rot-btn active" data-rot="0">0°</button>
            <button class="rot-btn" data-rot="90">90°</button>
            <button class="rot-btn" data-rot="180">180°</button>
            <button class="rot-btn" data-rot="270">270°</button>
          </div>
        </div>
      </section>

      <section class="control-group">
        <h2>Border</h2>
        <div class="control-row">
          <label for="border-style">Style</label>
          <select id="border-style">
            <option value="none">None</option>
            <option value="sashing">Sashing</option>
            <option value="cornerstone">Cornerstone</option>
            <option value="sawtooth-border">Sawtooth</option>
          </select>
        </div>
        <div class="control-row">
          <label for="border-width">Width</label>
          <input type="range" id="border-width" min="0.02" max="0.15" step="0.01" value="0.05">
        </div>
        <div class="control-row">
          <label for="border-color">Color</label>
          <input type="color" id="border-color" value="#2c3e50">
        </div>
      </section>

      <section class="control-group" id="pattern-options-section">
        <h2>Pattern Options</h2>
        <div id="pattern-options"></div>
      </section>

      <section class="control-group export-group">
        <h2>Export</h2>
        <p class="export-info">4500 × 5400 px @ 300 DPI</p>
        <p class="export-info-sub">Printify back-of-shirt ready</p>
        <div class="export-btns">
          <button id="export-png" class="btn btn-primary">Download PNG</button>
          <button id="export-jpg" class="btn btn-secondary">Download JPG</button>
        </div>
        <div id="export-spinner" class="spinner hidden">
          <div class="spinner-ring"></div>
          <span>Rendering high-res export…</span>
        </div>
      </section>
    </aside>

    <section id="preview-panel">
      <div id="canvas-wrapper">
        <canvas id="preview-canvas"></canvas>
      </div>
      <p id="preview-info"></p>
    </section>
  </main>

  <script type="module" src="js/patterns.js"></script>
  <script type="module" src="js/renderer.js"></script>
  <script type="module" src="js/export.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
